name: Collect prices

# Runs here rather than on Vercel Cron: a sweep of every store takes minutes,
# and a Hobby serverless function is capped at sixty seconds with one cron
# invocation a day.
on:
  schedule:
    # 06:10 UTC, which is 03:10 in Brasília — quiet for the stores, and done
    # before anybody shops.
    - cron: '10 6 * * *'
  workflow_dispatch:
    inputs:
      stores:
        description: 'Store slugs to collect, space separated. Empty means all.'
        required: false
        default: ''

concurrency:
  # Two runs at once would double the requests to every store.
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Mostly deliberate waiting: the collector paces itself per store, and
    # the basket is ~175 terms across a dozen stores. Raised from 45 when
    # the basket grew — a sweep that times out half way leaves the newest
    # aisles permanently uncollected, since each run starts from the top.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Collect
        run: npm run collect -- ${{ github.event.inputs.stores }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LOG_LEVEL: info

      # Verdicts already decided are free to apply and must be applied: a
      # grouping left unused is the duplicate back on somebody's screen.
      # Judging is not here on purpose — it costs, so it stays a decision.
      # The pending count printed here is what says when one is due.
      #
      # Runs even when the collection partly failed, because the products
      # that did arrive still need putting in the right place.
      - name: Reconcile
        if: always()
        run: npm run reconcile
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Rebuilding the feed ranking needs a direct connection: it runs
          # for half a minute, well past the statement timeout the HTTP
          # API allows.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          LOG_LEVEL: info

      # Last, because it is the step that makes the sweep affordable: one
      # night adds ~126,000 offers, and 0001 made them append-only with
      # nothing to take them away again. Eight nights of that spent 99.5%
      # of the 500 MB the project is allowed, and a project over the limit
      # goes read-only — which stops the collector, not the site.
      #
      # After reconcile rather than before: reconcile rebuilds the feed
      # ranking from the offers, so it should see the night's full set.
      #
      # Runs even when the collection partly failed. A failed sweep is
      # exactly when the table is least affordable and the prune is safest,
      # since a store's most recent offer is kept whatever its age.
      #
      # No `--vacuum` here, deliberately. Once the table is bounded the
      # night deletes about as many rows as it inserts, and autovacuum hands
      # that space back for reuse inside the table — so the allocated size
      # stays flat without the exclusive lock a rewrite would take every
      # night. The rewrite is a one-off, for the backlog this policy
      # inherits.
      - name: Prune offers
        if: always()
        run: npm run prune
        env:
          # No HTTP API here: the prune deletes in batches on one session
          # and reads its own progress between them.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          LOG_LEVEL: info
