name: Collect prices

# Runs here rather than on Vercel Cron: a sweep of every store takes minutes,
# and a Hobby serverless function is capped at sixty seconds with one cron
# invocation a day.
on:
  schedule:
    # 06:10 UTC, which is 03:10 in Brasília — quiet for the stores, and done
    # before anybody shops.
    - cron: '10 6 * * *'
  workflow_dispatch:
    inputs:
      stores:
        description: 'Store slugs to collect, space separated. Empty means all.'
        required: false
        default: ''

concurrency:
  # Two runs at once would double the requests to every store.
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Mostly deliberate waiting: the collector paces itself per store, and
    # the basket is ~175 terms across a dozen stores. Raised from 45 when
    # the basket grew — a sweep that times out half way leaves the newest
    # aisles permanently uncollected, since each run starts from the top.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Collect
        run: npm run collect -- ${{ github.event.inputs.stores }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LOG_LEVEL: info

      # Verdicts already decided are free to apply and must be applied: a
      # grouping left unused is the duplicate back on somebody's screen.
      # Judging is not here on purpose — it costs, so it stays a decision.
      # The pending count printed here is what says when one is due.
      #
      # Runs even when the collection partly failed, because the products
      # that did arrive still need putting in the right place.
      - name: Reconcile
        if: always()
        run: npm run reconcile
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Rebuilding the feed ranking needs a direct connection: it runs
          # for half a minute, well past the statement timeout the HTTP
          # API allows.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          LOG_LEVEL: info
