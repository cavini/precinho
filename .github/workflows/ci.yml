name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes the run in progress for the same branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # npm ci skips the macOS-only rolldown binding, which sits in
      # optionalDependencies for exactly this reason.
      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test with coverage thresholds
        run: npx vitest run --coverage

      # Builds with placeholder values: the build must not need a real
      # database, and this is what proves it stays that way.
      - name: Build
        run: npm run build
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder
          RATE_LIMIT_SALT: placeholder
